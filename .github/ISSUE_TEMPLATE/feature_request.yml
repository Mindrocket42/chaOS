name: Feature request
description: Suggest a concrete improvement to chaOS.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Start with the workflow or failure mode, not a preferred mechanism.

        chaOS deliberately keeps ChatGPT as the orchestrator and the local runtime small.
        A new worker system, scheduler, durable conversation store, required MCP/tunnel path,
        or second agent runtime is therefore a high architectural bar.

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and what blocks or slows you down today?
    validations:
      required: true

  - type: textarea
    id: invariant
    attributes:
      label: Relevant invariant or boundary
      description: Which current capability, provenance, receipt, idempotency, process-recovery or transport boundary is involved?
      placeholder: "Example: retained process recovery after a browser reload"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
      description: Describe the narrowest change that solves the problem without duplicating orchestration authority.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: How would we know it works?
      description: Describe the deterministic test, receipt or live proof that would verify the outcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Include existing chaOS primitives or simpler approaches you considered.
