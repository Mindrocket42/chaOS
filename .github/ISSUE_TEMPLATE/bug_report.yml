name: Bug report
description: Something behaved incorrectly in browser-native chaOS.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        chaOS is currently proof-stage software.

        **If this is a security problem, stop here.** Use the repository's
        Security → Report a vulnerability flow instead of a public issue.

        Do not include real credentials, private conversation text, usernames,
        private local paths, account/workspace identifiers, or process tokens.

  - type: input
    id: branch_commit
    attributes:
      label: Branch and commit
      description: Give the exact branch and commit SHA you tested. "Latest" is not sufficient.
      placeholder: "chaos-core-second-refresh @ abc1234"
    validations:
      required: true

  - type: input
    id: operating_system
    attributes:
      label: Operating system and version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: chrome_version
    attributes:
      label: Chrome version
      placeholder: "142.x"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did the problem occur?
      options:
        - "Native host / build"
        - "Chrome extension connection"
        - "Manual bridge"
        - "Automatic bridge"
        - "Filesystem action"
        - "Retained process action"
        - "Receipt / provenance / idempotency"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant chaOS configuration
      description: List approved virtual root names and which capabilities were on/off. Do not include private host paths unless essential and already redacted.
      placeholder: |
        roots: /project
        read: on
        search: on
        write: off
        command: off
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: receipt
    attributes:
      label: Relevant receipt or focused log excerpt
      description: Paste the smallest useful redacted evidence. Remove process_token values and all private data.
      render: text

  - type: checkboxes
    id: focused_checks
    attributes:
      label: Focused checks
      options:
        - label: I ran `TEST-BROWSER-NATIVE.cmd` or the equivalent focused checks and reported any failure above.
        - label: I confirmed this is not merely the inherited Electron/CoS runtime started by `npm run dev`.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Add only information that changes diagnosis. Keep private data redacted.
