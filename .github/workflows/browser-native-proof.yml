name: Browser-native proof

on:
  pull_request:
    paths:
      - 'src/main/bootstrap.ts'
      - 'src/main/native/**'
      - 'extension-chaos/**'
      - 'electron.vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-native-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-native-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-proof:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit test native protocol
        run: npx vitest run test/native-protocol.test.ts
      - name: Build unpacked Windows x64 app
        run: npm run dist:dir:x64
      - name: Stage browser-native proof
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force browser-native-proof | Out-Null
          Copy-Item -Recurse release/win-unpacked browser-native-proof/chaOS
          Copy-Item -Recurse extension-chaos browser-native-proof/extension-chaos
          Set-Content -Encoding ASCII browser-native-proof/register-host.cmd '@echo off & "%~dp0chaOS\Chat On Steroids.exe" --register-chaos-native-host & pause'
          Set-Content -Encoding ASCII browser-native-proof/unregister-host.cmd '@echo off & "%~dp0chaOS\Chat On Steroids.exe" --unregister-chaos-native-host & pause'
          @'
          1. Double-click register-host.cmd.
          2. Open chrome://extensions and enable Developer mode.
          3. Choose Load unpacked and select the extension-chaos folder in this proof bundle.
          4. Open the chaOS Local Bridge extension popup.

          Expected:
          Connected
          Transport: Chrome Native Messaging
          MCP tunnel: Not used
          Native host: Running

          To remove local browser access, click Disconnect local bridge in the popup.
          To remove the Chrome native-host registration entirely, double-click unregister-host.cmd.
          '@ | Set-Content -Encoding UTF8 browser-native-proof/README.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: chaos-browser-native-windows-x64
          path: browser-native-proof/
          retention-days: 7
