name: chaOS CI

on:
  push:
    branches: [main]
    paths:
      - 'native-host/**'
      - 'extension-chaos/**'
      - 'scripts/verify-chaos-native-host.mjs'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/CURRENT-ARCHITECTURE.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/browser-native-proof.yml'
  pull_request:
    paths:
      - 'native-host/**'
      - 'extension-chaos/**'
      - 'scripts/verify-chaos-native-host.mjs'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/CURRENT-ARCHITECTURE.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/browser-native-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Go tests and extension syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@v6
        with:
          go-version-file: native-host/go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check extension JavaScript
        run: |
          node --check extension-chaos/background.js
          node --check extension-chaos/content.js
          node --check extension-chaos/popup.js

      - name: Test native host
        working-directory: native-host
        run: go test ./...

      - name: Vet native host
        working-directory: native-host
        run: go vet ./...

      - name: Build native host on Linux
        working-directory: native-host
        run: go build ./...

  windows-build:
    name: Windows native-host build
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@v6
        with:
          go-version-file: native-host/go.mod

      - name: Test native host
        working-directory: native-host
        run: go test ./...

      - name: Build chaos-host.exe
        working-directory: native-host
        run: go build -trimpath -ldflags="-s -w" -o ../chaos-host.exe .

      - name: Exercise Chrome Native Messaging framing
        run: node scripts/verify-chaos-native-host.mjs "chaos-host.exe"
